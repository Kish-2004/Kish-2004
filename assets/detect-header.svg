<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e2640" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#1a1035"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="360" fill="url(#bg)"/>
  <rect width="1000" height="360" fill="url(#grid)"/>

  <!-- top bar -->
  <text x="24" y="28" fill="#64748b" font-size="13">model: yolov8 · input: portfolio.jpg · status: <tspan fill="#22c55e">OPEN_TO_WORK</tspan></text>
  <circle cx="960" cy="23" r="5" fill="#22c55e"><animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/></circle>

  <!-- name -->
  <text x="76" y="178" fill="#ffffff" font-size="64" font-weight="700" letter-spacing="2">KISHORE KUMAR</text>

  <!-- box 1 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="8s" repeatCount="indefinite"/>
    <rect x="60" y="108" width="600" height="90" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-width="2.5"/>
    <rect x="60" y="86" width="270" height="22" fill="#a78bfa"/>
    <text x="68" y="102" fill="#0b0f1a" font-size="13" font-weight="700">full_stack_dev  0.99</text>
  </g>

  <!-- box 2 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.22;0.92;1" dur="8s" repeatCount="indefinite"/>
    <rect x="60" y="240" width="290" height="56" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-width="2.5"/>
    <rect x="60" y="218" width="190" height="22" fill="#22d3ee"/>
    <text x="68" y="234" fill="#0b0f1a" font-size="13" font-weight="700">ai_ml_engineer  0.97</text>
    <text x="74" y="274" fill="#e2e8f0" font-size="15">RAG · Agentic AI · LLMs</text>
  </g>

  <!-- box 3 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.36;0.92;1" dur="8s" repeatCount="indefinite"/>
    <rect x="370" y="240" width="290" height="56" fill="#f472b6" fill-opacity="0.08" stroke="#f472b6" stroke-width="2.5"/>
    <rect x="370" y="218" width="200" height="22" fill="#f472b6"/>
    <text x="378" y="234" fill="#0b0f1a" font-size="13" font-weight="700">computer_vision  0.96</text>
    <text x="384" y="274" fill="#e2e8f0" font-size="15">YOLO · Detection</text>
  </g>

  <!-- car silhouette -->
  <g transform="translate(700,150)" stroke="#94a3b8" stroke-width="2.5" fill="none" stroke-linejoin="round">
    <path d="M10 110 L10 82 Q10 70 24 66 L56 58 L86 22 Q92 14 104 14 L176 14 Q188 14 196 24 L222 58 L260 66 Q276 70 276 84 L276 110 Z"/>
    <path d="M92 28 L66 58 L140 58 L140 28 Z"/>
    <path d="M150 28 L150 58 L214 58 L190 28 Z"/>
    <circle cx="70" cy="112" r="22" fill="#0b0f1a"/>
    <circle cx="216" cy="112" r="22" fill="#0b0f1a"/>
    <circle cx="70" cy="112" r="8"/>
    <circle cx="216" cy="112" r="8"/>
  </g>

  <!-- damage box -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.5;0.92;1" dur="8s" repeatCount="indefinite"/>
    <rect x="708" y="200" width="82" height="52" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="2.5"/>
    <rect x="708" y="178" width="112" height="22" fill="#ef4444"/>
    <text x="714" y="194" fill="#ffffff" font-size="13" font-weight="700">damage 0.93</text>
  </g>
  <text x="700" y="318" fill="#64748b" font-size="13">↳ my live Azure app does this → cost estimate</text>

  <!-- scan line -->
  <rect x="-60" y="0" width="60" height="360" fill="url(#scan)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="1060 0" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
